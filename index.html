<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyaoiastro - Python in the Stars</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div class="stars-container"></div>

    <header>
        <div class="logo">
            <span class="logo-icon">✨</span>
            <h1>pyaoiastro</h1>
        </div>
        <nav>
            <div class="status" id="pyodide-status">
                <span class="status-dot"></span>
                <span class="status-text">Loading Pyodide...</span>
            </div>
        </nav>
    </header>

    <main>
        <section class="editor-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Python Editor</h2>
                    <div class="controls controls-wrap">
                        <select id="sample-select" class="input-compact">
                            <option value="">Sample code</option>
                            <option value="hello">Hello + loop</option>
                            <option value="math">Math + list</option>
                            <option value="plot">Matplotlib demo</option>
                        </select>
                        <button id="run-btn" class="btn primary" disabled>Run Code</button>
                        <button id="reset-btn" class="btn secondary">Reset</button>
                        <button id="download-btn" class="btn secondary">Download .py</button>
                        <label class="btn secondary file-btn" for="upload-file">Upload .py</label>
                        <input type="file" id="upload-file" accept=".py,text/x-python" hidden>
                    </div>
                </div>
                <div class="panel-meta">
                    <span id="run-meta">Last run: not yet</span>
                    <span id="save-meta">Autosave: enabled</span>
                </div>
                <div class="tool-grid">
                    <div class="tool-row">
                        <button id="run-selection-btn" class="btn secondary" disabled>Run Selection</button>
                        <button id="format-btn" class="btn secondary">Format</button>
                        <button id="copy-code-btn" class="btn secondary">Copy Code</button>
                        <button id="share-btn" class="btn secondary">Share Link</button>
                        <button id="theme-btn" class="btn secondary">Theme: Dark</button>
                    </div>
                    <div class="tool-row">
                        <button id="wrap-btn" class="btn secondary">Wrap: On</button>
                        <button id="line-btn" class="btn secondary">Line#: On</button>
                        <label for="font-size" class="tool-label">Font</label>
                        <input type="range" id="font-size" min="12" max="24" value="14">
                        <span id="font-size-value" class="tool-value">14px</span>
                    </div>
                    <div class="tool-row">
                        <input type="text" id="search-input" class="input-compact" placeholder="Find text">
                        <button id="search-next-btn" class="btn secondary">Find Next</button>
                        <button id="snapshot-save-btn" class="btn secondary">Save Snapshot</button>
                        <button id="snapshot-load-btn" class="btn secondary">Load Snapshot</button>
                        <button id="snapshot-clear-btn" class="btn secondary">Clear Snapshot</button>
                    </div>
                    <div class="tool-row">
                        <label for="history-select" class="tool-label">History</label>
                        <select id="history-select" class="input-compact grow">
                            <option value="">Select previous run</option>
                        </select>
                        <button id="reset-runtime-btn" class="btn secondary">Reset Runtime</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <div id="code-editor"></div>
                </div>
            </div>
        </section>

        <section class="output-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Console Output</h2>
                    <div class="controls">
                        <button id="copy-output-btn" class="btn secondary">Copy Output</button>
                        <button id="download-output-btn" class="btn secondary">Download Log</button>
                        <button id="clear-btn" class="btn secondary">Clear</button>
                    </div>
                </div>
                <div id="output" class="console-output">Initializing environment...</div>
            </div>
        </section>

        <section class="package-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Install Packages</h2>
                </div>
                <div class="package-controls">
                    <input type="text" id="package-name" placeholder="Package name (e.g. snowballstemmer)">
                    <button id="install-btn" class="btn primary" disabled>Install</button>
                </div>
                <div id="package-status" class="package-status"></div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
