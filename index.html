<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyaoiastro - Python in the Stars</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
    <div class="stars-container"></div>
    
    <header>
        <div class="logo">
            <span class="logo-icon">✨</span>
            <h1>pyaoiastro</h1>
        </div>
        <nav>
            <div class="status" id="pyodide-status">
                <span class="status-dot"></span>
                <span class="status-text">Loading Pyodide...</span>
            </div>
        </nav>
    </header>

    <main>
        <section class="editor-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Python Editor</h2>
                    <div class="controls">
                        <button id="run-btn" class="btn primary" disabled>Run Code</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea id="code-input" spellcheck="false"># Welcome to pyaoiastro!
import sys
print(f"Python version: {sys.version}")

# You can install pure python packages using micropip
# Example:
# import micropip
# await micropip.install("snowballstemmer")
# import snowballstemmer
</textarea>
                </div>
            </div>
        </section>

        <section class="output-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Console Output</h2>
                    <button id="clear-btn" class="btn secondary">Clear</button>
                </div>
                <div id="output" class="console-output">Initializing environment...</div>
            </div>
        </section>

        <section class="package-section">
            <div class="glass-panel">
                <div class="panel-header">
                    <h2>Install Packages</h2>
                </div>
                <div class="package-controls">
                    <input type="text" id="package-name" placeholder="Package name (e.g. snowballstemmer)">
                    <button id="install-btn" class="btn primary" disabled>Install</button>
                </div>
                <div id="package-status" class="package-status"></div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
